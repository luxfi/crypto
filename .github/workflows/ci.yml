name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        cgo: ['0', '1']
    runs-on: ${{ matrix.arch == 'arm64' && 'hanzo-build-linux-arm64' || 'hanzo-build-linux-amd64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        if: matrix.cgo == '0'
        run: test -z "$(gofmt -s -l .)"
      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -v -count=1 -race -timeout=15m ./...
      - name: Coverage (CGO build, amd64 only — single canonical baseline)
        if: matrix.cgo == '1' && matrix.arch == 'amd64'
        run: |
          # Verkle's two encoding tests (TestParseNodeEoA +
          # TestParseNodeSingleSlot) are t.Skip'd with documented
          # spec-mismatch TODOs; the rest of verkle now runs and
          # contributes to the coverage baseline.
          go test -count=1 -coverprofile=coverage.txt -covermode=atomic \
            -timeout=15m ./...
          go tool cover -func=coverage.txt | tail -1
      - name: Coverage floor gate (must stay ≥ 60%)
        if: matrix.cgo == '1' && matrix.arch == 'amd64'
        run: |
          PCT=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $3}' | tr -d '%')
          # Use awk for float comparison (bash can't compare floats).
          DROP=$(awk -v p="$PCT" 'BEGIN { print (p < 60.0) ? 1 : 0 }')
          if [ "$DROP" = "1" ]; then
            echo "::error::Coverage dropped to $PCT% (floor 60%)"
            exit 2
          fi
          echo "Coverage: $PCT% (floor 60%)"
      - name: Upload coverage to codecov
        if: matrix.cgo == '1' && matrix.arch == 'amd64'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: crypto
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
      - name: Bench
        if: matrix.cgo == '1'
        run: go test -bench=. -benchmem -benchtime=100ms ./... || true

  hqc-pqclean-e2e:
    name: HQC PQClean cgo e2e (NIST KAT roundtrip)
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: HQC PQClean cgo build + test
        env:
          CGO_ENABLED: '1'
        run: |
          go test -count=1 -tags=hqc_pqclean -v ./hqc/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'hanzo-build-linux-arm64' || 'hanzo-build-linux-amd64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: make build
