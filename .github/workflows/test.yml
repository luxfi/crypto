name: test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  go:
    strategy:
      fail-fast: false
      # `hanzo-build-linux-arm64` does not exist. arm64 binaries cannot be
      # EXECUTED on amd64 runners; tests run amd64 only.
      matrix:
        arch: [amd64]
        cgo: ['0', '1']
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -v -count=1 ./...

  rust:
    strategy:
      fail-fast: false
      # Same constraint: cargo test must execute on the build host's arch.
      matrix:
        arch: [amd64]
    runs-on: hanzo-build-linux-amd64
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace --all-features
