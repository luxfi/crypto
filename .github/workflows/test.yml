name: test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        cgo: ['0', '1']
    runs-on: ${{ matrix.arch == 'arm64' && 'hanzo-build-linux-arm64' || 'hanzo-build-linux-amd64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -v -count=1 ./...

  rust:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'hanzo-build-linux-arm64' || 'hanzo-build-linux-amd64' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace --all-features
