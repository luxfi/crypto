[package]
name = "lux-crypto"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Canonical Rust crate for Lux crypto. Calls into luxcpp/crypto via the lux_crypto C-ABI."

# This crate is the canonical Rust entry point for Lux crypto.
# Mirrors github.com/luxfi/gpu (canonical Rust binding to luxfi/accel).
#
# Phase 1 surface:
#   * secp256k1: secp256k1_ecrecover, secp256k1_ecrecover_batch
#
# Build expectations:
#   - Environment variable `CRYPTO_DIR` points to the install prefix that
#     contains `include/lux/crypto/*.h` and `lib/lib<alg>_cpu.a`.
#   - Or, set `CRYPTO_BUILD_DIR` to the cmake build directory.
#   - Deprecated names `LUX_CRYPTO_DIR` / `LUX_CRYPTO_BUILD_DIR` are read for
#     one release with a deprecation warning.
#
# Brand-neutral naming: NO -sys suffix. We author the C/C++ ourselves at
# luxcpp/crypto; this is not a wrapper around third-party FFI. One crate
# per first-party FFI surface; safe wrappers (if needed) live as a `pub mod safe`.

[lib]
name = "lux_crypto"

[build-dependencies]
