[package]
name = "lux-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Umbrella crate for Lux crypto. Re-exports per-algorithm crates that bind to luxcpp/crypto via the C-ABI."
keywords = ["luxfi", "crypto", "blockchain", "post-quantum", "ffi"]
categories = ["cryptography"]

# This crate is the canonical Rust entry point for Lux crypto.
# Mirrors github.com/luxfi/gpu (canonical Rust binding to luxfi/accel).
#
# Surface:
#   * secp256k1 — ECDSA public-key recovery (single + batch)
#   * mldsa     — FIPS 204 ML-DSA modes 2/3/5
#   * mlkem     — FIPS 203 ML-KEM modes 2/3/5
#   * slhdsa    — FIPS 205 SLH-DSA modes 2/3/5
#   * ed25519   — keygen / sign / verify
#   * keccak256 — single-shot 32-byte digest
#
# Build expectations:
#   - Environment variable `CRYPTO_DIR` points to the install prefix that
#     contains `include/lux/crypto/*.h` and `lib/lib<alg>_cpu.a`.
#   - Or, set `CRYPTO_BUILD_DIR` to the cmake build directory containing
#     `<alg>/lib<alg>_cpu.a`.
#   - Deprecated names `LUX_CRYPTO_DIR` / `LUX_CRYPTO_BUILD_DIR` are read for
#     one release with a deprecation warning.
#
# Brand-neutral naming: NO -sys suffix. We author the C/C++ ourselves at
# luxcpp/crypto; this is not a wrapper around third-party FFI. One crate
# per first-party FFI surface; safe wrappers live in the per-algorithm
# `pub mod` blocks in src/lib.rs.

[lib]
name = "lux_crypto"

# The umbrella crate retains the original raw-FFI surface
# (mldsa, mlkem, slhdsa, ed25519, keccak256, secp256k1 modules) for
# backward compatibility with existing consumers. The canonical entry
# points for new code are the per-algorithm crates in this workspace:
#   * lux-crypto-keccak    -> keccak256 (verified against published vectors)
#   * lux-crypto-secp256k1 -> secp256k1 ecrecover (verified)
# Per-algorithm crates for the remaining algorithms will land as their
# C-ABI bodies are wired in luxcpp/crypto. See COVERAGE.md.
